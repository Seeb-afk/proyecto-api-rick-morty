<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      if (sessionStorage.getItem("rickandmorty-session")) {
        window.location.replace("../app/main.html");
      }
    </script>
  </head>
  <body class="grid place-items-center box-border min-h-screen bg-[#E8EAEE] py-6 px-8">

    <div class="w-full max-w-[440px] mx-auto">

      <form 
        action=""
        id="loginForm" 
        class="flex flex-col bg-white rounded-lg p-6 shadow-md gap-7 border border-gray-300"
      >
      
        <h2 class="font-bold text-2xl text-center text-[#20232A]">
          Ingresar
        </h2>

        <div class="flex flex-col gap-6">

          <label for="correo" class="text-md text-[#20232A] font-semibold flex flex-col">
            Correo electrónico
            <input type="text" id="correo" placeholder="Ej: juan@gmail.com" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>

          <label for="clave" class="text-md text-[#20232A] font-semibold flex flex-col">
            Contraseña
            <input type="password" id="clave" placeholder="Ingresa tu contraseña" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>
        </div>

        <ul id="message">
          <!--Aqui va el mensaje por si da error-->
        </ul>

        <button type="submit" class="flex justify-center bg-[#3B82F6] hover:bg-[#2563EB] active:bg-[#1D4ED8] text-gray-100 font-semibold rounded-lg py-2 cursor-pointer">
          Ingresar
        </button>

        <a href="./register.html" class="w-fit mx-auto text-[14px] text-gray-600 hover:text-[#3B82F6] hover:underline font-semibold p-1 px-3 rounded-full">
          ¿No tienes una cuenta? Regístrate
        </a>
      </form>
    </div>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
