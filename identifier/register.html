<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      if (sessionStorage.getItem("rickandmorty-session")) {
        window.location.replace("../app/main.html");
      }
    </script>
  </head>
  <body class="grid place-items-center box-border min-h-screen bg-[#E8EAEE] py-6 px-8">
    
    <div class="w-full max-w-[520px] mx-auto">
      
      <form 
        action=""
        id="form"
        class="flex flex-col bg-white rounded-lg p-6 shadow-md gap-7 border border-gray-300"
      >
        
        <h2 class="font-bold text-2xl text-center text-[#20232A]">
          Registrarse
        </h2>

        <!--Datos personales-->
        <fieldset class="flex flex-col border border-gray-400 p-6 gap-4 rounded-lg">
          <legend class="text-sm text-[#20232A] font-semibold px-1">
            Datos Personales
          </legend>

          <label for="nombre" class="text-md text-[#20232A] font-semibold flex flex-col">
            Nombre
            <input type="text" id="nombre" placeholder="Ej: Juan" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>

          <label for="apellido" class="text-md text-[#20232A] text-[#20232A] font-semibold flex flex-col">
            Apellido
            <input type="text" id="apellido" placeholder="Ej: Rodriguez" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>

          <label for="correo" class="text-md text-[#20232A] font-semibold flex flex-col">
            Correo
            <input type="text" id="correo" placeholder="Ej: juan@gmail.com" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>
        </fieldset>

        <!--Seguridad-->
        <fieldset class="flex flex-col border border-gray-400 p-6 gap-4 rounded-lg">
          <legend class="text-sm text-[#20232A] font-semibold px-1">
            Seguridad
          </legend>

          <label for="clave" class="text-md text-[#20232A] font-semibold flex flex-col">
            Contraseña
            <input type="password" id="clave" placeholder="Ej: Juan123." class="border border-gray-400 rounded-lg py-2 px-2">
            <span class="text-[11px] font-semibold text-gray-700">
              Nota: Mínimo 8 caracteres, debe contener al menos 1 mayúscula, 1 minúscula, 1 número y 1 caracter especial.
            </span>
          </label>

          <label for="validar" class="text-md text-[#20232A] font-semibold flex flex-col">
            Validar Contraseña
            <input type="password" id="validar" placeholder="Repite la misma contraseña" class="border border-gray-400 rounded-lg py-2 px-2">
          </label>
        </fieldset>

        <ul id="message">
          <!--Aqui va la validacion-->
        </ul>

        <button type="submit" class="flex justify-center bg-[#3B82F6] hover:bg-[#2563EB] active:bg-[#1D4ED8] text-gray-100 font-semibold rounded-lg py-2 cursor-pointer">
          Enviar
        </button>

        <a href="./login.html" class="w-fit mx-auto text-[14px] text-gray-600 hover:text-[#3B82F6] hover:underline font-semibold p-1 px-3 rounded-full">
          ¿Ya tienes una cuenta? Ingresa
        </a>
      </form>
    </div>
    <script type="module" src="../js/register.js"></script>
  </body>
</html>
