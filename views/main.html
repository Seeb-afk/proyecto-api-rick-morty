<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body class="flex flex-col box-border bg-[#E8EAEE] w-full">
    
    <div class="flex flex-col w-full">

      <header class="flex items-center justify-between w-full h-16 bg-white border-b border-slate-300 px-2 lg:px-4 gap-4">
        
        <button class="flex items-center">
          <img src="./svg/logo.svg" alt="Rick and Morty Logo" class="w-12 cursor-pointer shrink-0">
        </button>

        <div class="flex items-center w-full max-w-[480px]">

          <button type="submit" class="flex border border-r-0 border-slate-300 bg-[#F2F2F2] hover:bg-[#E5E5E5] py-1.5 px-3 rounded-l-full cursor-pointer">
            <span class="material-symbols-outlined text-[#20232A]">
              search
            </span>
          </button>

          <input type="text" id="search" placeholder="Buscar..." class="flex-1 flex py-1.5 px-2 border border-slate-300 outline-none rounded-r-full">
        </div>

        <button class="flex items-center">
          <span class="flex material-symbols-outlined !text-[36px] text-[#20232A] cursor-pointer">
            account_circle
          </span>
        </button>
      </header>

      <main class="">
        
        
      </main>
    </div>
    <script src="../js/main.js"></script>
  </body>
</html>
