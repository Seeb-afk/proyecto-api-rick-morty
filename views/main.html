<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  </head>
  <body class="flex flex-col box-border bg-[#E8EAEE] w-full">
    
    <div class="flex flex-col w-full min-h-screen">

      <header class="sticky top-0 flex items-center justify-between w-full h-16 bg-white border-b border-gray-300 px-2 lg:px-4 gap-4">
        
        <button class="flex items-center">
          <img src="./svg/logo.svg" alt="Rick and Morty Logo" class="w-12 cursor-pointer shrink-0">
        </button>

        <div class="flex items-center w-full max-w-[480px] min-w-0">

          <button type="submit" class="flex border border-r-0 border-gray-300 bg-[#F2F2F2] hover:bg-[#E5E5E5] py-1.5 px-3 rounded-l-full cursor-pointer">
            <span class="material-symbols-outlined text-[#20232A]">
              search
            </span>
          </button>

          <input type="text" id="search" placeholder="Buscar..." class="flex-1 flex py-1.5 px-2 border border-gray-300 outline-none rounded-r-full min-w-0">
        </div>

        <div class="flex items-center gap-3">

          <button id="favorites" class="hidden sm:inline flex items-center bg-[#3B82F6] hover:bg-[#2563EB] active:bg-[#1D4ED8] py-2 px-3 rounded-md cursor-pointer">
            <span class="flex items-center text-sm text-white font-semibold whitespace-nowrap">
              Ver favoritos
            </span>
          </button>

          <button class="flex items-center">
            <span class="flex material-symbols-outlined !text-[36px] text-[#20232A] hover:bg-[#E5E5E5] rounded-full p-1 cursor-pointer">
              account_circle
            </span>
          </button>
        </div>
      </header>

      <div class="grid grid-cols-3 w-full max-w-4xl mx-auto gap-3 md:gap-4 min-w-[360px] p-4">
            
        <button class="flex items-center justify-center text-sm md:text-md text-[#20232A] font-semibold bg-white py-2 px-4 border border-gray-300 rounded-lg shrink-0 cursor-pointer">
          Personajes
        </button>

        <button class="flex items-center justify-center text-sm md:text-md text-[#20232A] font-semibold bg-white py-2 px-4 border border-gray-300 rounded-lg shrink-0 cursor-pointer">
          Ubicaciones
        </button>

        <button class="flex items-center justify-center text-sm md:text-md text-[#20232A] font-semibold bg-white py-2 px-4 border border-gray-300 rounded-lg shrink-0 cursor-pointer">
          Episodios 
        </button>
      </div>

      <div class="flex-1 flex flex-col justify-start items-center py-8 px-12">

        <main id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 justify-center items-center w-full min-w-[360px] py-4 px-4 gap-4">
          
        </main>
      </div>

      <footer class="flex items-center justify-center w-full h-16 bg-white border-t border-gray-300 px-2 lg:px-4 gap-4">
        <span class="text-md font-semibold text-gray-500">
          © 2026 Rick & Morty Visualizer
        </span>
      </footer>
    </div>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
